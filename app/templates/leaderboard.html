<!-- app/templates/leaderboard.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BingoQuest Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    h2 { margin-bottom: 8px; }
    table { border-collapse: collapse; width: 100%; max-width: 720px; }
    th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
    th { background: #f7f7f7; }
    .muted { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h2>🏆 BingoQuest Leaderboard</h2>
  <div class="muted">Auto-refreshes every 5 seconds</div>
  <table id="board">
    <thead>
      <tr><th>Rank</th><th>Team</th><th>Score</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadBoard() {
      try {
        const res = await fetch('/api/leaderboard');
        const json = await res.json();
        const tbody = document.querySelector('#board tbody');
        tbody.innerHTML = '';
        json.data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${row.rank}</td><td>${row.team}</td><td>${row.score}</td>`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error('Failed to load leaderboard', e);
      }
    }
    loadBoard();
    setInterval(loadBoard, 5000);
  </script>
</body>
</html>
